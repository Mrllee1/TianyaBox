<!--
Direction A independent brief — 轻甜延续
Layout: a familiar mobile Discover page with pill categories, two equal-width
content cards, one full-width primary action and a quiet four-item bottom bar.
Typography: Avenir Next for Latin / numbers; PingFang SC / Microsoft YaHei / Noto Sans SC for Chinese.
Color: white canvas, mint-blue-lilac accents, cyan selection, deep blue-grey text.
Hard constraint: preserve the original light, rounded, two-column visual grammar;
use gradients only on the companion panel and the primary action. No dark surfaces,
serif UI, external assets, purchase claims or business implementation changes.
-->
<style>
.dir-a{width:100%;max-width:360px;height:620px;box-sizing:border-box;overflow:hidden;background:#fff;color:#19363f;font-family:"Avenir Next","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;display:flex;flex-direction:column;text-align:left;font-style:normal}
.dir-a *{box-sizing:border-box}
.dir-a button{font:inherit;font-style:normal;border:0;cursor:pointer;color:inherit}
.dir-a .a-status{height:26px;flex:none;padding:9px 21px 0;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.dir-a .a-status svg{width:54px;height:14px}
.dir-a .a-header{height:44px;flex:none;padding:4px 20px 0;display:flex;align-items:center;gap:10px}
.dir-a .a-wordmark{margin:0;font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.6px}
.dir-a .a-brand-dot{display:inline-block;width:10px;height:10px;margin-left:3px;border-radius:50%;background:#54c9c1;vertical-align:top}
.dir-a .a-header-spacer{flex:1}
.dir-a .a-icon-button{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:50%;background:#f5f7f8}
.dir-a .a-icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.dir-a .a-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e3faf8;padding:1px}
.dir-a .a-intro{margin:0 20px 6px;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.2px}
.dir-a .a-categories{display:flex;gap:7px;padding:0 20px;height:34px;flex:none;align-items:flex-start}
.dir-a .a-category{padding:7px 12px;border-radius:18px;background:#f4f6f7;font-size:14px;line-height:20px;white-space:nowrap;color:#60727a}
.dir-a .a-category.is-active{background:#ddf8f2;color:#076a79;font-weight:600}
.dir-a .a-buddy{height:60px;flex:none;margin:8px 20px;border-radius:20px;position:relative;display:flex;align-items:center;background:linear-gradient(110deg,#effbf8 15%,#f1f6ff 70%,#f6f0ff);padding:8px 12px 8px 18px;isolation:isolate;overflow:hidden}
.dir-a .a-buddy-copy{position:relative;z-index:1;max-width:220px}
.dir-a .a-buddy-title{margin:0 0 2px;font-size:15px;line-height:21px;font-weight:600}
.dir-a .a-buddy-sub{margin:0;font-size:14px;line-height:20px;color:#536c77}
.dir-a .a-buddy img{position:absolute;right:-8px;bottom:-7px;width:96px;height:76px;object-fit:contain;opacity:.96;z-index:0}
.dir-a .a-section-head{display:flex;justify-content:space-between;align-items:center;margin:0 20px 8px}
.dir-a .a-section-head h3{font-size:17px;line-height:24px;font-weight:600;margin:0}
.dir-a .a-section-note{font-size:14px;line-height:20px;color:#687780}
.dir-a .a-grid{padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;flex:none}
.dir-a .a-card{min-width:0;border:1px solid #e7eef0;border-radius:20px;overflow:hidden;background:#fff}
.dir-a .a-card-art{height:100px;position:relative;background-color:#e6edf0;background-image:var(--preview-story);background-size:cover;background-position:center 23%}
.dir-a .a-card-art:after{content:"";position:absolute;inset:60% 0 0;background:linear-gradient(transparent,rgba(12,31,38,.18))}
.dir-a .a-card-art.a-companion{display:grid;place-items:center;background-image:none;background-color:#e5f9f8}
.dir-a .a-companion img{width:132px;height:96px;object-fit:contain}
.dir-a .a-card-copy{padding:8px 11px 9px}
.dir-a .a-card-copy h4{margin:0 0 2px;font-size:16px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-a .a-card-copy p{margin:0;font-size:14px;line-height:20px;color:#687780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-a .a-primary{margin:12px 20px 0;display:flex;align-items:center;justify-content:center;gap:9px;height:42px;flex:none;border-radius:24px;background:linear-gradient(105deg,#8cf2e3,#82c9ef 58%,#b9a0f4);font-size:16px;font-weight:600;line-height:24px;color:#19363f}
.dir-a .a-primary svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dir-a .a-bottom{margin-top:auto;display:flex;justify-content:space-around;flex:none;border-top:1px solid #edf1f3;height:60px;padding:8px 12px 9px;background:#fff}
.dir-a .a-nav{width:25%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;line-height:18px;color:#78878d;background:transparent}
.dir-a .a-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dir-a .a-nav.is-active{color:#087c91;font-weight:600}
.dir-a .a-nav.is-active svg{stroke-width:2.2}
.dir-a button:focus-visible{outline:2px solid #087c91;outline-offset:3px}
.dir-a button:active{opacity:.78}
@media(max-width:380px){.dir-a .a-header,.dir-a .a-grid,.dir-a .a-categories{padding-left:16px;padding-right:16px}.dir-a .a-intro,.dir-a .a-buddy,.dir-a .a-section-head,.dir-a .a-primary{margin-left:16px;margin-right:16px}.dir-a .a-buddy-title{font-size:15px}.dir-a .a-buddy-copy{max-width:205px}}
</style>
