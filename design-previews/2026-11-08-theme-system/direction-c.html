<!--
独立方向 brief / C · 月光剧场
互斥约束：必须采用深色、整幅角色画面与编辑式章节布局；不使用双列发现卡片、彩色胶囊阵列或装饰光晕。
布局：品牌与短标题 → 细线分类 → 单幅故事封面 → 伙伴提示 / 单一对话动作 → 克制底栏。
字体：短标题 Songti SC / STSong；中文正文 PingFang SC / Microsoft YaHei / Noto Sans SC；西文品牌 Avenir Next。
色彩：深墨蓝 #101D2A、抬升面 #192B3B、冰蓝 #C6DEE8、正文 #F1F5F7、次级 #B5C3CF。
素材：原版故事画面 CSS 变量 --preview-story；爱锦锦鲤吉祥物 assets/mascot.png。无外网资源。
-->
<style>
.dir-c{width:100%;max-width:360px;height:600px;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) 62px;overflow:hidden;isolation:isolate;background:#101d2a;color:#f1f5f7;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;line-height:1.5;text-align:left;color-scheme:dark}
.dir-c *{box-sizing:border-box}
.dir-c button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dir-c button:focus-visible{outline:2px solid #c6dee8;outline-offset:4px}
.dir-c .c-header{padding:17px 20px 0}
.dir-c .c-brand-row{display:flex;align-items:center;justify-content:space-between;min-height:21px}
.dir-c .c-brand{display:flex;align-items:center;gap:7px;font-family:"Avenir Next","PingFang SC",sans-serif;font-size:14px;font-weight:600;letter-spacing:1px}
.dir-c .c-brand svg{width:18px;height:18px;flex:none;color:#c6dee8}
.dir-c .c-header-action{display:grid;place-items:center;width:30px;height:30px;margin:-4px -4px -4px 0;padding:4px;border:0;border-radius:50%;background:transparent;color:#c6dee8}
.dir-c .c-header-action svg{width:19px;height:19px}
.dir-c .c-title{margin:11px 0 12px;font-family:"Songti SC","STSong",serif;font-size:24px;font-weight:600;letter-spacing:1px;line-height:1.45}
.dir-c .c-categories{display:flex;align-items:center;justify-content:space-between;gap:10px;height:37px;border-bottom:1px solid #344453}
.dir-c .c-category{position:relative;align-self:stretch;min-width:44px;padding:0 0 10px;border:0;background:transparent;font-size:14px;color:#b5c3cf}
.dir-c .c-category[aria-current="page"]{color:#f1f5f7;font-weight:600}
.dir-c .c-category[aria-current="page"]:after{content:"";position:absolute;bottom:-1px;left:0;width:28px;height:2px;background:#c6dee8}
.dir-c .c-content{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:12px;padding:14px 20px 14px}
.dir-c .c-story{position:relative;min-height:214px;overflow:hidden;border-radius:8px;background-color:#253b49;background-image:var(--preview-story);background-size:cover;background-position:center 23%}
.dir-c .c-story:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,24,34,.12) 12%,rgba(12,24,34,0) 35%,rgba(12,24,34,.84) 100%);pointer-events:none}
.dir-c .c-story-top{position:absolute;inset:14px 14px auto;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dir-c .c-story-label{padding:4px 8px;border:1px solid rgba(241,245,247,.35);border-radius:3px;background:rgba(16,29,42,.7);color:#f1f5f7;font-size:14px}
.dir-c .c-save{display:grid;place-items:center;flex:none;width:32px;height:32px;padding:7px;border:1px solid rgba(241,245,247,.35);border-radius:50%;background:rgba(16,29,42,.72)}
.dir-c .c-save svg{width:17px;height:17px}
.dir-c .c-story-copy{position:absolute;inset:auto 16px 17px;z-index:1}
.dir-c .c-story-copy h2{margin:0 0 6px;font-family:"Songti SC","STSong",serif;font-size:24px;line-height:1.4;font-weight:600;letter-spacing:1px;text-shadow:0 1px 4px rgba(16,29,42,.55)}
.dir-c .c-story-copy p{margin:0;color:#e0e9ef;font-size:14px;line-height:1.5}
.dir-c .c-companion-line{display:flex;align-items:center;gap:10px;min-height:43px}
.dir-c .c-companion{display:block;flex:none;width:43px;height:40px;object-fit:contain}
.dir-c .c-companion-copy{min-width:0}
.dir-c .c-companion-copy p{margin:0;color:#e7eef3;font-size:14px;line-height:1.5}
.dir-c .c-companion-copy span{display:block;color:#b5c3cf;font-size:14px;line-height:1.5}
.dir-c .c-talk{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;padding:10px 16px;border:1px solid #c6dee8;border-radius:5px;background:#c6dee8;color:#132938;font-weight:600;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms cubic-bezier(.23,1,.32,1)}
.dir-c .c-talk svg{width:20px;height:20px;flex:none}
.dir-c .c-talk:active{transform:scale(.985);background:#b6d2df}
.dir-c .c-bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:4px 12px 6px;border-top:1px solid #344453;background:#101d2a}
.dir-c .c-nav{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-width:0;min-height:48px;padding:2px;border:0;background:transparent;color:#a5b5c3;font-size:14px;line-height:1.4}
.dir-c .c-nav svg{width:20px;height:20px}
.dir-c .c-nav[aria-current="page"]{color:#e4f1f5}
@media(hover:hover) and (pointer:fine){.dir-c .c-talk:hover{background:#d9e9f0}.dir-c .c-category:hover{color:#f1f5f7}.dir-c .c-header-action:hover{background:#25394a}.dir-c .c-save:hover{background:#263c4e}}
@media(prefers-reduced-motion:reduce){.dir-c .c-talk{transition:none}}
</style>
<div class="dir-c" lang="zh-CN">
  <header class="c-header">
    <div class="c-brand-row">
      <div class="c-brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18.9 15.4A8.2 8.2 0 0 1 8.6 5.1 8.2 8.2 0 1 0 18.9 15.4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m17 3 .7 2.3L20 6l-2.3.7L17 9l-.7-2.3L14 6l2.3-.7L17 3Z" fill="currentColor"/></svg>爱锦</div>
      <button class="c-header-action" type="button" aria-label="搜索角色"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <h1 class="c-title">让故事，靠近一点。</h1>
    <nav class="c-categories" aria-label="内容分类">
      <button class="c-category" type="button" aria-current="page">推荐</button>
      <button class="c-category" type="button">群聊</button>
      <button class="c-category" type="button">模拟器</button>
      <button class="c-category" type="button">互动剧场</button>
    </nav>
  </header>
  <main class="c-content">
    <article class="c-story" aria-label="柠神的偏爱角色故事">
      <div class="c-story-top"><span class="c-story-label">今晚的故事</span><button class="c-save" type="button" aria-label="收藏柠神的偏爱"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4V4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button></div>
      <div class="c-story-copy"><h2>柠神的偏爱</h2><p>校园 · 慢热 · 专属陪伴</p></div>
    </article>
    <div class="c-companion-line"><img class="c-companion" src="assets/mascot.png" alt="锦鲤伙伴"><div class="c-companion-copy"><p>把喧闹留在门外。</p><span>留一段时间，给彼此。</span></div></div>
    <button class="c-talk" type="button"><span>进入对话</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </main>
  <nav class="c-bottom" aria-label="底部导航">
    <button class="c-nav" type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 10 8-6 8 6v10h-6v-6h-4v6H4V10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>首页</span></button>
    <button class="c-nav" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="m15 9-2 4-4 2 2-4 4-2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>发现</span></button>
    <button class="c-nav" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-2 2v-9.5A7.5 7.5 0 0 1 10.5 4h2A7.5 7.5 0 0 1 20 11.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 11h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>消息</span></button>
    <button class="c-nav" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 20v-2a7 7 0 0 1 14 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>我的</span></button>
  </nav>
</div>
